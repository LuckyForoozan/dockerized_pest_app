apiVersion: batch/v1
kind: Job
metadata:
  name: eda-preprocessing
spec:
  backoffLimit: 0
  template:
    spec:
      containers:
      - name: model
        image: pest-models:v1
        imagePullPolicy: Never
        command: ["python", "EDA/agritech_pest_eda_and_preprocessing.py"]
      restartPolicy: Never
---
apiVersion: batch/v1
kind: Job
metadata:
  name: linear-prediction
spec:
  backoffLimit: 0
  template:
    spec:
      containers:
      - name: model
        image: pest-models:v1
        imagePullPolicy: Never
        command: ["python", "containerized_pest_linearPrediction/agritech_pest_prediction(linearproblem).py"]
      restartPolicy: Never
---
